name: release

# Runs on tag push (v*): build → sign → notarize → DMG → GitHub Release
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      # ── Import Developer ID certificate ──
      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p ci-keychain ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci-keychain ci.keychain
          security import /tmp/cert.p12 -k ci.keychain -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-keychain ci.keychain
          rm -f /tmp/cert.p12

      # ── App Store Connect API key (for notarytool) ──
      - name: Setup notarytool credentials
        env:
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          AC_KEY_ID: ${{ secrets.AC_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_ISSUER_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$AC_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${AC_KEY_ID}.p8
          xcrun notarytool store-credentials "HermesControl-notarize" \
            --key ~/private_keys/AuthKey_${AC_KEY_ID}.p8 \
            --key-id "$AC_KEY_ID" \
            --issuer "$AC_ISSUER_ID"

      # ── Build + sign ──
      - name: Build and sign
        run: ./build.sh --no-install

      # ── Test ──
      - name: Test
        run: swift test

      # ── Notarize app ──
      - name: Notarize app
        run: |
          ditto -c -k --keepParent HermesControl.app HermesControl.zip
          xcrun notarytool submit HermesControl.zip \
            --keychain-profile "HermesControl-notarize" --wait
          xcrun stapler staple HermesControl.app
          rm HermesControl.zip

      # ── Create DMG ──
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create and notarize DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          create-dmg \
            --volname "HermesControl" \
            --volicon "HermesControl.icns" \
            --window-pos 200 120 --window-size 600 380 \
            --icon-size 100 \
            --icon "HermesControl.app" 160 185 \
            --hide-extension "HermesControl.app" \
            --app-drop-link 430 185 \
            --no-internet-enable \
            "HermesControl-${VERSION}.dmg" \
            "HermesControl.app"
          DEV_ID_HASH=$(security find-identity -v -p codesigning \
            | grep "Developer ID Application" | head -1 | awk '{print $2}')
          codesign --force --sign "$DEV_ID_HASH" "HermesControl-${VERSION}.dmg"
          xcrun notarytool submit "HermesControl-${VERSION}.dmg" \
            --keychain-profile "HermesControl-notarize" --wait
          xcrun stapler staple "HermesControl-${VERSION}.dmg"
          echo "DMG_PATH=HermesControl-${VERSION}.dmg" >> "$GITHUB_ENV"

      # ── Create GitHub Release ──
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NOTES=$(awk "/## \[${VERSION#v}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          gh release create "$VERSION" \
            "$DMG_PATH" \
            --title "Hermes Control ${VERSION}" \
            --notes "${NOTES:-See CHANGELOG.md}"

      # ── Cleanup ──
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain ci.keychain 2>/dev/null || true
          rm -f ~/private_keys/AuthKey_*.p8
